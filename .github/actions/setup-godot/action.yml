name: Set up Godot
description: Installs the Godot version pinned in .godot-version (and, optionally, its export templates), then links the Studio Kit into every project.
inputs:
  templates:
    description: Also install export templates
    default: "false"
runs:
  using: composite
  steps:
    - name: Read the pinned version
      id: version
      shell: bash
      run: |
        version="$(tr -d '[:space:]' < .godot-version)"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Godot $version-stable"

    - name: Cache Godot
      id: cache-godot
      uses: actions/cache@v4
      with:
        path: ~/godot
        key: godot-${{ steps.version.outputs.version }}-linux

    - name: Download Godot
      if: steps.cache-godot.outputs.cache-hit != 'true'
      shell: bash
      run: |
        v="${{ steps.version.outputs.version }}"
        mkdir -p ~/godot
        curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${v}-stable/Godot_v${v}-stable_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d ~/godot
        mv ~/godot/Godot_v${v}-stable_linux.x86_64 ~/godot/godot

    - name: Cache export templates
      if: inputs.templates == 'true'
      id: cache-templates
      uses: actions/cache@v4
      with:
        path: ~/.local/share/godot/export_templates
        key: godot-templates-${{ steps.version.outputs.version }}

    - name: Download export templates
      if: inputs.templates == 'true' && steps.cache-templates.outputs.cache-hit != 'true'
      shell: bash
      run: |
        v="${{ steps.version.outputs.version }}"
        dest=~/.local/share/godot/export_templates/${v}.stable
        mkdir -p "$dest"
        curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${v}-stable/Godot_v${v}-stable_export_templates.tpz"
        unzip -q /tmp/templates.tpz -d /tmp/templates
        mv /tmp/templates/templates/* "$dest/"
        ls "$dest"

    - name: Put Godot on the path and link the kit
      shell: bash
      run: |
        sudo ln -sf ~/godot/godot /usr/local/bin/godot
        godot --version
        python3 tools/link_kit.py
