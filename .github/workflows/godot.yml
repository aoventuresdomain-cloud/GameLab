name: godot

# Kit tests on every pull request. Holdfast tests and exports when kit/,
# games/holdfast/ or the pipeline change, and on every push to main (which
# also keeps the Windows and web builds as downloadable artifacts).
# Any red job blocks merge (branch protection: require these checks).
# One secret: BUTLER_API_KEY, used only by the main-only itch.io draft upload
# (set up by the owner through the Setup Desk). See tools/release/README.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      holdfast: ${{ steps.filter.outputs.holdfast }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "holdfast=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "$changed"
          if echo "$changed" | grep -qE '^(kit/|games/holdfast/|tools/link_kit.py|tools/ci/|\.godot-version|\.github/)'; then
            echo "holdfast=true" >> "$GITHUB_OUTPUT"
          else
            echo "holdfast=false" >> "$GITHUB_OUTPUT"
          fi

  kit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Import the kit host project
        run: tools/ci/godot.sh --headless --path tools/kit-host --import
      - name: Kit tests
        run: tools/ci/godot.sh --headless --path tools/kit-host -s res://addons/gamelab_kit/testing/run_tests.gd -- res://addons/gamelab_kit/tests

  kit-link-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Link the kit on a Windows checkout
        run: |
          python tools/link_kit.py
          python tools/link_kit.py --check

  holdfast:
    needs: changes
    if: needs.changes.outputs.holdfast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          templates: "true"
      - name: Import the project
        run: tools/ci/godot.sh --headless --path games/holdfast --import
      - name: Open the project with the kit enabled
        run: tools/ci/godot.sh --headless --path games/holdfast --quit
      - name: Kit tests inside Holdfast
        run: tools/ci/godot.sh --headless --path games/holdfast -s res://addons/gamelab_kit/testing/run_tests.gd -- res://addons/gamelab_kit/tests
      - name: Holdfast tests
        run: tools/ci/godot.sh --headless --path games/holdfast -s res://addons/gamelab_kit/testing/run_tests.gd -- res://tests
      - name: Run UI tests
        run: tools/ci/godot.sh --headless --path games/holdfast --script res://tests/run_ui_tests.gd
      - name: Ten simulated hours of progression (60 s budget, determinism check)
        run: tools/ci/godot.sh --headless --path games/holdfast -s res://tools/progression.gd -- --hours=10 --seed=1 --budget=60 --out=../../reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holdfast-progression-${{ github.sha }}
          path: reports
          if-no-files-found: ignore
      - name: Install the pinned GodotSteam Windows template
        run: tools/ci/fetch_godotsteam.sh
      - name: Export web (single-threaded) and Windows
        run: |
          mkdir -p build/web build/windows
          # Web uses Godot's stock templates; Windows uses GodotSteam's (preset custom template).
          tools/ci/godot.sh --headless --path games/holdfast --export-release "Web" ../../build/web/index.html
          tools/ci/godot.sh --headless --path games/holdfast --export-release "Windows Desktop" ../../build/windows/Holdfast.exe
          cp build/godotsteam/steam_api64.dll build/windows/
          # One double-click for the manual Steam check (HF-M1-05, F-017).
          cp games/holdfast/tools/steam-test.bat build/windows/
          ls -la build/web build/windows
      # HF-M1-06: what an unsigned macOS export costs. Recorded, never blocking.
      - name: Try an unsigned macOS export
        id: macos
        continue-on-error: true
        run: |
          mkdir -p build/macos
          tools/ci/godot.sh --headless --path games/holdfast --export-release "macOS" ../../build/macos/Holdfast.zip
          ls -la build/macos
      - name: Record the macOS result
        if: always()
        run: |
          echo "macOS unsigned export: ${{ steps.macos.outcome }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: holdfast-web-${{ github.sha }}
          path: build/web
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}
      - uses: actions/upload-artifact@v4
        with:
          name: holdfast-windows-${{ github.sha }}
          path: build/windows
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}

  # HF-M1-03: each exported build plays one full run with the bot aura, and any
  # error in its log fails the job.
  smoke-web:
    needs: holdfast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: holdfast-web-${{ github.sha }}
          path: build/web
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Play one run in headless Chrome
        run: |
          npm install --no-save --no-package-lock playwright-core@1
          python3 -m http.server 8060 --directory build/web &
          # Wait until the server answers (up to 15 s) rather than guessing.
          for _ in $(seq 1 75); do
            curl -fsS -o /dev/null http://localhost:8060/index.html && break
            sleep 0.2
          done
          curl -fsS -o /dev/null http://localhost:8060/index.html || { echo "::error::web server did not start"; exit 1; }
          node tools/ci/web_smoke.mjs "http://localhost:8060/index.html?autoplay=1&seed=1" 240

  smoke-windows:
    needs: holdfast
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: holdfast-windows-${{ github.sha }}
          path: build/windows
      - name: Play one run in the Windows build
        shell: pwsh
        run: |
          $log = & build/windows/Holdfast.console.exe --headless -- --autoplay --seed=1 2>&1 | Out-String
          Write-Output $log
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Holdfast exited with $LASTEXITCODE"; exit 1 }
          if ($log -notmatch 'AUTOPLAY DONE') { Write-Output "::error::no finished run in the log"; exit 1 }
          if ($log -match '(?m)^(SCRIPT )?ERROR:') { Write-Output "::error::errors in the log"; exit 1 }
          # F-015: the build must carry GodotSteam (the run is headless, so Steam itself stays off).
          if ($log -notmatch 'GodotSteam loaded: yes') { Write-Output "::error::GodotSteam is not loaded in the Windows build"; exit 1 }
          if (-not (Test-Path build/windows/steam-test.bat)) { Write-Output "::error::steam-test.bat is missing from the Windows build"; exit 1 }

  # KIT-08: the same seed-1 progression run on Windows (the official Windows
  # editor, same pinned version) and a check that its full report hash equals
  # the Linux run's. Both logs print the whole hash.
  determinism-windows:
    needs: holdfast
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Godot (Windows editor)
        run: |
          v="$(tr -d '[:space:]' < .godot-version)"
          f="Godot_v${v}-stable_win64.exe.zip"
          curl -fsSL --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${v}-stable/$f"
          tools/ci/verify_godot_download.sh "$f" godot.zip
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          7z x -y "-o$(cygpath -w "$tmp/godot-zip")" godot.zip > /dev/null
          mkdir -p "$tmp/godot-bin"
          # The console build, so its log reaches the job log; "godot" on the path for tools/ci/godot.sh.
          cp "$tmp/godot-zip/Godot_v${v}-stable_win64_console.exe" "$tmp/godot-bin/godot.exe"
          cygpath -w "$tmp/godot-bin" >> "$GITHUB_PATH"
      - name: Link the kit and import the project
        run: |
          python tools/link_kit.py
          godot --version
          tools/ci/godot.sh --headless --path games/holdfast --import
      - name: Ten simulated hours of progression on Windows
        run: tools/ci/godot.sh --headless --path games/holdfast -s res://tools/progression.gd -- --hours=10 --seed=1 --budget=60 --out=../../reports-windows
      - uses: actions/download-artifact@v4
        with:
          name: holdfast-progression-${{ github.sha }}
          path: reports-linux
      - name: Same hash on Linux and Windows
        run: python tools/ci/compare_progression.py reports-linux/progression.json reports-windows/progression.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holdfast-progression-windows-${{ github.sha }}
          path: reports-windows
          if-no-files-found: ignore

  # KIT-08: the Windows build plays a run on screen (not headless) at each size
  # and saves screenshots, so Windows readability can be checked without a
  # Windows PC. The runner has no GPU, so Mesa's software OpenGL sits beside the
  # exe for this job only; it is not part of the release artifact.
  screens-windows:
    needs: holdfast
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: holdfast-windows-${{ github.sha }}
          path: build/windows
      - name: Install Mesa software OpenGL beside the build
        shell: bash
        run: tools/ci/fetch_mesa_windows.sh build/windows
      - name: Play a run on screen at 1280x720 and 1920x1080
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          $failed = $false
          foreach ($size in '1280x720', '1920x1080') {
            $w, $h = $size -split 'x'
            & ./tools/ci/set_display_resolution.ps1 -Width $w -Height $h
            if ($LASTEXITCODE -ne 0) { $failed = $true; continue }
            $shots = Join-Path $PWD "screenshots/$size"
            $out = "run-$size.log"
            $err = "run-$size.err.log"
            $game = @('--rendering-driver', 'opengl3', '--audio-driver', 'Dummy', '--resolution', $size,
                      '--', '--autoplay', '--seed=1', "--screenshot-dir=$shots")
            $p = Start-Process -FilePath build/windows/Holdfast.console.exe -ArgumentList $game `
                   -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -NoNewWindow
            if (-not $p.WaitForExit(240000)) {
              Write-Output "::error::the $size run did not finish in 4 minutes"
              taskkill /PID $p.Id /T /F | Out-Null
              $failed = $true
            }
            Get-Content $out, $err
            $log = (Get-Content $out, $err | Out-String)
            if ($log -notmatch 'AUTOPLAY DONE') { Write-Output "::error::no finished run at $size"; $failed = $true }
            if ($log -match '(?m)^(SCRIPT )?ERROR:') { Write-Output "::error::errors in the $size log"; $failed = $true }
            python tools/ci/check_screenshots.py $size "screenshots/$size"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holdfast-windows-screens-${{ github.sha }}
          path: |
            screenshots
            run-*.log
          if-no-files-found: ignore

  # The butler pin (version and checksum) is checked on pull requests too, so a
  # bad pin fails here rather than on main. No secrets in this job.
  butler-pin:
    needs: changes
    if: needs.changes.outputs.holdfast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned butler
        run: tools/ci/install_butler.sh

  # Every push to main uploads the web build to the owner's private itch.io
  # draft page for Gate 1. Butler only uploads files; it cannot change the
  # page's visibility, so the page stays a draft.
  itch-draft:
    needs: [holdfast, smoke-web, butler-pin]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ITCH_TARGET: aoventuresdomain-cloud/holdfast-tech-proof:html5
    steps:
      # Checkout first: it cleans the workspace, which would remove the build.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: holdfast-web-${{ github.sha }}
          path: build/web
      - name: Install the pinned butler
        run: tools/ci/install_butler.sh
      - name: Upload the web build to the itch.io draft page
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::error::BUTLER_API_KEY is not set (Setup Desk)"; exit 1
          fi
          butler/butler push build/web "$ITCH_TARGET" --userversion "${GITHUB_SHA::12}"
